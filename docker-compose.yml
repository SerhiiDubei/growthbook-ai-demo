services:
  app:
    build: .
    container_name: growthbook-ai-demo
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - growthbook
      - mongo
      - events-postgres
    networks: [appnet]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  growthbook:
    image: growthbook/growthbook
    container_name: growthbook
    environment:
      - MONGODB_URI=mongodb://mongo:27017/growthbook
      - NODE_ENV=production
      - ENCRYPTION_KEY=${GB_ENCRYPTION_KEY}
      - JWT_SECRET=${GB_JWT_SECRET}
      - ENABLE_ADMIN_API=true
      - ADMIN_API_KEYS=${GB_ADMIN_TOKEN}
      - APP_ORIGIN=${GB_APP_ORIGIN:-http://localhost:3000}
    ports:
      - "3000:3000"  # UI
      - "3100:3100"  # Admin/API
    depends_on:
      - mongo
    networks: [appnet]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  mongo:
    image: mongo:6
    container_name: mongo
    volumes:
      - mongo_data:/data/db
    networks: [appnet]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  events-postgres:
    image: postgres:16-alpine
    container_name: events-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gb_events
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Порт НЕ відкривається назовні — доступ тільки через внутрішню мережу appnet
    expose:
      - "5432"
    volumes:
      - events_pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [appnet]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  appnet:

volumes:
  mongo_data:
  events_pg_data:
