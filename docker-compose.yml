services:

  # ── Nginx reverse proxy + SSL termination ─────────────────
  # Єдина точка входу ззовні. Слухає 80 і 443.
  # Проксює: /api/v1/* → growthbook:3100, /* → app:8080
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx конфіги (default.conf або ssl.conf перейменований)
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL сертифікати від Let's Encrypt (спільний volume з certbot)
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      # Тека для Let's Encrypt HTTP challenge токенів
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - app
      - growthbook
    networks: [appnet]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Certbot — автоматичне оновлення SSL сертифікатів ──────
  # Раз на 12 годин перевіряє чи потрібно оновити сертифікат
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    # Нескінченний цикл: спробуй renewal → чекай 12h → повтори
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  app:
    build: .
    container_name: growthbook-ai-demo
    # 8080 НЕ відкритий назовні — доступ тільки через Nginx
    expose:
      - "8080"
    env_file: .env
    depends_on:
      - growthbook
      - mongo
      - events-postgres
    networks: [appnet]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  growthbook:
    image: growthbook/growthbook
    container_name: growthbook
    environment:
      - MONGODB_URI=mongodb://mongo:27017/growthbook
      - NODE_ENV=production
      - ENCRYPTION_KEY=${GB_ENCRYPTION_KEY}
      - JWT_SECRET=${GB_JWT_SECRET}
      - ENABLE_ADMIN_API=true
      - ADMIN_API_KEYS=${GB_ADMIN_TOKEN}
      - APP_ORIGIN=${GB_APP_ORIGIN:-http://localhost:3000}
      - API_HOST=${GB_API_HOST:-http://localhost:3100}
    # 3000 — GrowthBook UI (доступ через SSH tunnel: ssh -L 3000:localhost:3000 ...)
    # 3100 — НЕ відкритий назовні, SDK API проходить через Nginx /api/v1/
    ports:
      - "3000:3000"
    expose:
      - "3100"
    depends_on:
      - mongo
    networks: [appnet]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  mongo:
    image: mongo:6
    container_name: mongo
    volumes:
      - mongo_data:/data/db
    networks: [appnet]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  events-postgres:
    image: postgres:16-alpine
    container_name: events-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gb_events
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Порт НЕ відкривається назовні — доступ тільки через внутрішню мережу appnet
    expose:
      - "5432"
    volumes:
      - events_pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [appnet]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  appnet:

volumes:
  mongo_data:
  events_pg_data:
