# ──────────────────────────────────────────────────────────────
# КРОК 2: HTTPS конфіг (вмикається після отримання SSL сертифікату)
#
# Як активувати:
#   1. Переконайся що certbot відпрацював (є папка /etc/letsencrypt/live/)
#   2. Видали або перейменуй default.conf:
#        mv nginx/conf.d/default.conf nginx/conf.d/default.conf.bak
#   3. Перейменуй цей файл:
#        mv nginx/conf.d/ssl.conf nginx/conf.d/default.conf
#   4. Перезапусти nginx:
#        docker compose exec nginx nginx -s reload
#
# Архітектура проксювання:
#   ┌─────────────────────────────────────────────┐
#   │  growthappai.duckdns.org (Nginx 443)         │
#   │                                             │
#   │  /api/v1/*  ──► growthbook:3100  (SDK API)  │
#   │  /*         ──► app:8080         (Spring)   │
#   └─────────────────────────────────────────────┘
#
# Чому /api/v1/ іде до growthbook?
#   Браузерний GrowthBook SDK шукає фічі на:
#   https://growthappai.duckdns.org/api/v1/features/<sdk-key>
#   Наш Spring Boot використовує /api/gb/*, /api/experiments/*, /bridge/* — конфліктів нема.
# ──────────────────────────────────────────────────────────────

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name growthappai.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS main server
server {
    listen 443 ssl;
    server_name growthappai.duckdns.org;

    # SSL сертифікати від Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/growthappai.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/growthappai.duckdns.org/privkey.pem;

    # Сучасні SSL налаштування
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # ── GrowthBook SDK API ─────────────────────────────────
    # Браузерний SDK на зовнішніх сайтах буде звертатись сюди
    # щоб отримати поточний стан фіч/експериментів
    location /api/v1/ {
        proxy_pass       http://growthbook:3100/api/v1/;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Spring Boot App (все інше) ─────────────────────────
    location / {
        proxy_pass         http://app:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;

        # WebSocket підтримка (для SSE/streaming AI відповідей)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
