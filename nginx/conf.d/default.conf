# ──────────────────────────────────────────────────────────────
# КРОК 1: HTTP-only конфіг
# Використовується щоб:
#   a) Let's Encrypt міг верифікувати домен (/.well-known/acme-challenge/)
#   b) Тимчасово проксювати трафік до Spring Boot на 8080
#
# Після отримання SSL сертифікату цей файл замінюється на ssl.conf
# (інструкцію дивись у nginx/conf.d/ssl.conf)
# ──────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name growthappai.duckdns.org;

    # Let's Encrypt HTTP challenge — certbot пише сюди токен верифікації
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Поки немає SSL — проксюємо напряму на Spring Boot
    location / {
        proxy_pass         http://app:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
